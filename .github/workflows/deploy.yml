name: Deploy on microCMS Update

on:
  push:
    branches: [main]
  repository_dispatch:
    types:
      [
        microcms-events-update,
        microcms-constants-update,
        microcms-shops-update,
        microcms-shop_indexes-update,
      ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Remove Cache
        run: rm -rf ./.next
      
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun ci

      - name: Build
        run: bun run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
