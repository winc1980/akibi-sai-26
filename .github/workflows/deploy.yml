name: Deploy on microCMS Update

on:
  repository_dispatch:
    types: [microcms-events-update]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install deps
        run: bun ci
      
      - name: Build
        run: bun run build
      
      - name: Deploy
        run: bun run deploy
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

